name: CI

on:
  push:
  pull_request:

jobs:
  typecheck-and-build:
    name: Typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  e2e:
    name: Testes e2e (emulador do Firestore + Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: typecheck-and-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # firebase-tools (usado pra subir o emulador do Firestore nos
          # testes) exige Java 21+ a partir da v14 — 17 falha com
          # "firebase-tools no longer supports Java version before 21".
          java-version: '21'
      - run: npm ci
      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium
      - name: Rodar a suite e2e
        run: npm test
